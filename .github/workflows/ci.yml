name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  github-actions-lint:
    uses: ./.github/workflows/github-actions-lint.yml

  secret-scan:
    uses: ./.github/workflows/secret-scan.yml

  dependabot-auto-merge:
    needs: [github-actions-lint, secret-scan]
    uses: ./.github/workflows/dependabot-auto-merge.yml
    permissions:
      contents: write
      pull-requests: write
