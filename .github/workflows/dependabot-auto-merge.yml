name: Auto merge dependabot pull requests
# Dependabotが作成したPRのうち、GitHub Actionsの更新またはパッチバージョンの更新を自動でマージする
# 呼び出し元の必須チェックの後ろから needs で呼ぶこと。並行して呼ぶと、CI が終わる前にマージしようとする

on:
  workflow_call:

jobs:
  automerge-pr:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3 ## dependabotの更新内容を取得（https://github.com/dependabot/fetch-metadata）
      - name: Auto approve and merge
        if: ${{ steps.meta.outputs.package-ecosystem == 'github_actions' || steps.meta.outputs.update-type != 'version-update:semver-major' }}
        run: |
          # リポジトリ設定のAllow GitHub Actions to create and approve pull requestsを有効にしておく必要あり
          gh pr review ${{ github.event.number }} --approve
          # --auto は使わない。private のリポジトリでは GitHub Free だと使えない
          gh pr merge ${{ github.event.number }} --merge
        env:
          GH_TOKEN: ${{ github.token }}
